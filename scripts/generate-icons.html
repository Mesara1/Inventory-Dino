<!DOCTYPE html>
<html>
<head><title>Generate PWA Icons</title></head>
<body>
<h2>Dinopop Corn — Icon Generator</h2>
<p>กด Generate แล้ว save ทั้ง 2 ไฟล์ไปไว้ที่ <code>frontend/icons/</code></p>
<button onclick="generate()">Generate Icons</button>
<div id="output" style="margin-top:20px;display:flex;gap:20px;align-items:flex-start"></div>

<script>
function drawIcon(size) {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  const r = size * 0.18;

  // Background rounded rect
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fillStyle = '#E5A12A';
  ctx.fill();

  // Popcorn bucket shape
  const cx = size / 2;
  const cy = size / 2;
  const s = size * 0.28;

  // Bucket body
  ctx.beginPath();
  ctx.moveTo(cx - s * 0.7, cy - s * 0.1);
  ctx.lineTo(cx - s * 0.55, cy + s);
  ctx.lineTo(cx + s * 0.55, cy + s);
  ctx.lineTo(cx + s * 0.7, cy - s * 0.1);
  ctx.closePath();
  ctx.fillStyle = '#2a1f0d';
  ctx.fill();

  // Stripe on bucket
  ctx.fillStyle = '#E5A12A';
  ctx.fillRect(cx - s * 0.08, cy - s * 0.1, s * 0.16, s * 1.1);

  // Popcorn balls
  const ballR = s * 0.28;
  const balls = [
    [cx, cy - s * 0.55],
    [cx - s * 0.5, cy - s * 0.35],
    [cx + s * 0.5, cy - s * 0.35],
    [cx - s * 0.25, cy - s * 0.75],
    [cx + s * 0.25, cy - s * 0.75],
  ];
  balls.forEach(([bx, by]) => {
    ctx.beginPath();
    ctx.arc(bx, by, ballR, 0, Math.PI * 2);
    ctx.fillStyle = '#fff8e7';
    ctx.fill();
    ctx.strokeStyle = '#2a1f0d';
    ctx.lineWidth = size * 0.012;
    ctx.stroke();
  });

  return canvas;
}

function generate() {
  const output = document.getElementById('output');
  output.innerHTML = '';
  [192, 512].forEach(size => {
    const canvas = drawIcon(size);
    const div = document.createElement('div');
    div.style.textAlign = 'center';

    const label = document.createElement('p');
    label.textContent = `icon-${size}.png`;
    label.style.margin = '0 0 8px';

    const preview = document.createElement('img');
    preview.src = canvas.toDataURL();
    preview.style.width = '96px';
    preview.style.border = '1px solid #ccc';
    preview.style.borderRadius = '8px';
    preview.style.display = 'block';

    const link = document.createElement('a');
    link.href = canvas.toDataURL('image/png');
    link.download = `icon-${size}.png`;
    link.textContent = `⬇ Save icon-${size}.png`;
    link.style.display = 'block';
    link.style.marginTop = '8px';

    div.appendChild(label);
    div.appendChild(preview);
    div.appendChild(link);
    output.appendChild(div);
  });
}
</script>
</body>
</html>
